name: Build & Release VSIX Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install VSCE
        run: npm install -g @vscode/vsce

      - name: Package Extension VSIX
        run: |
          cd extension
          vsce package --no-dependencies --out ../antigravity-tokendashboard.vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: Release ${{ github.ref_name }}
          files: antigravity-tokendashboard.vsix
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Publish to Visual Studio Marketplace (Optional)
        if: env.VS_MARKETPLACE_TOKEN != '' && startsWith(github.ref, 'refs/tags/')
        env:
          VS_MARKETPLACE_TOKEN: ${{ secrets.VS_MARKETPLACE_TOKEN }}
        run: |
          cd extension
          vsce publish --pat ${{ secrets.VS_MARKETPLACE_TOKEN }} --no-dependencies

      - name: Publish to Open VSX Registry (Optional)
        if: env.OVSX_PAT != '' && startsWith(github.ref, 'refs/tags/')
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npm install -g ovsx
          cd extension
          ovsx publish --pat ${{ secrets.OVSX_PAT }}
